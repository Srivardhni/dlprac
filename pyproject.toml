[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlpracticals"
version = "0.1.0"
description = "Simplified and reference programs for deep learning lab practicals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
tensorflow = ["tensorflow"]
vision = ["opencv-python", "pillow", "scikit-learn", "pandas"]
all = ["tensorflow", "opencv-python", "pillow", "scikit-learn", "pandas", "seaborn"]

[project.scripts]
dlprac = "dlpracticals.cli:main"

[tool.setuptools.packages.find]
include = ["dlpracticals*"]
